<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/admin-layout :: layout(~{::section}, 'Products')}">
<section>
<div class="flex items-center gap-2 flex-wrap">
  <h1 class="text-xl font-extrabold">Products</h1>
  <div class="ml-auto"><label for="kw" class="block text-xs font-medium mb-1">Search Products</label><input id="kw" placeholder="Search SKU / name..." class="border rounded-lg px-3 py-2 text-sm"/></div>
  <div><label for="fAvail" class="block text-xs font-medium mb-1">Availability</label><select id="fAvail" class="border rounded-lg px-3 py-2 text-sm"><option value="">All</option><option value="IN_STOCK">In stock</option><option value="LOW_STOCK">Low</option><option value="OUT_OF_STOCK">Out</option></select></div>
  <div><label for="fStatus" class="block text-xs font-medium mb-1">Status</label><select id="fStatusF" class="border rounded-lg px-3 py-2 text-sm"><option value="">All</option><option value="ACTIVE" selected>Active</option><option value="INACTIVE">Inactive</option></select></div>
  <button onclick="loadP(0)" class="bg-slate-900 text-white px-4 py-2 rounded-lg text-sm">Search</button>
  <button onclick="pModal()" class="bg-orange-500 text-white px-4 py-2 rounded-lg text-sm font-bold">+ Add</button>
</div>
<div class="bg-white rounded-xl shadow mt-3 overflow-x-auto">
<table class="w-full text-sm"><thead class="bg-slate-50"><tr><th class="p-3 text-left">SKU</th><th class="p-3 text-left">Name</th><th class="p-3 text-right">Price</th><th class="p-3 text-right">Stock</th><th class="p-3 text-left">Availability</th><th class="p-3 text-left">Status</th><th class="p-3 text-left">Actions</th></tr></thead>
<tbody id="rows"></tbody></table></div>
<div class="flex gap-2 mt-3 text-sm"><button onclick="pgGo(-1)" class="px-3 py-1.5 bg-white border rounded">← Prev</button><span id="pageInfo" class="text-slate-500"></span><button onclick="pgGo(1)" class="px-3 py-1.5 bg-white border rounded">Next →</button></div>
<script>
let pg=0;function pgGo(d){pg=Math.max(0,pg+d);loadP(pg);}
async function loadP(p=0){pg=p;
  const kw=document.getElementById('kw').value,av=document.getElementById('fAvail').value,st=(document.getElementById('fStatusF')||{}).value||'';
  try{const r=await App.get(`/api/products?keyword=${encodeURIComponent(kw)}&availability=${av}&status=${st}&page=${pg}&size=10`);
    const{items,page}=App.unwrapPage(r.data);
    document.getElementById('rows').innerHTML=items.map(x=>`<tr class="border-t ${x.status!=='ACTIVE'?'opacity-60 bg-slate-50':''}">
      <td class="p-3">${App.escapeHtml(x.sku||'')}</td><td class="p-3 font-medium">${App.escapeHtml(x.name)}</td>
      <td class="p-3 text-right font-bold">${App.money(x.sellingPrice)}</td><td class="p-3 text-right">${x.currentStock??0}</td>
      <td class="p-3">${App.badge(x.availabilityStatus||x.status)}</td>
      <td class="p-3">${App.badge(x.status)}</td>
      <td class="p-3 flex gap-1"><button onclick='pModal(${JSON.stringify(x)})' class="px-2 py-1 bg-slate-100 rounded">Edit</button>
      ${x.status==='ACTIVE'
        ?`<button onclick="delP(${x.id})" class="px-2 py-1 bg-red-100 text-red-700 rounded">Deactivate</button>`
        :`<button onclick="restoreP(${x.id})" class="px-2 py-1 bg-green-100 text-green-700 rounded">Reactivate</button>`}</td></tr>`).join('')||'<tr><td colspan="7" class="p-4 text-center text-slate-400">No products</td></tr>';
    if(page)document.getElementById('pageInfo').textContent=`Page ${page.number+1} of ${page.totalPages} • ${page.totalElements}`;
  }catch(e){document.getElementById('rows').innerHTML='<tr><td colspan="7" class="p-4 text-center text-red-500">Load failed</td></tr>';}
}
async function restoreP(id){try{await App.patch('/api/products/'+id+'/status',{status:'ACTIVE'});App.toast('Reactivated','success');loadP(pg);}catch(e){}}
async function pModal(x){
  const e=!!(x&&x.id);x=x||{};
  let cats=[],units=[],brands=[];
  try{const r=await App.get('/api/categories?page=0&size=100');cats=App.unwrapPage(r.data).items||[];}catch(_){}
  try{const r=await App.get('/api/units?page=0&size=100');units=App.unwrapPage(r.data).items||[];}catch(_){}
  try{const r=await App.get('/api/brands?page=0&size=100');brands=App.unwrapPage(r.data).items||[];}catch(_){}
  const opts=(list,sel)=>list.map(o=>`<option value="${o.id}"${String(o.id)===String(sel)?' selected':''}>${App.escapeHtml(o.name)}</option>`).join('');
  const st=x.status||'ACTIVE';
  App.openModal(`<h3 class="font-bold text-lg mb-3">${e?'Edit':'Add'} Product</h3><div class="grid grid-cols-2 gap-3 text-sm">
    <div><label for="fSku" class="block font-medium mb-1">SKU ${e?'':'<span class="font-normal text-slate-500">(auto-generated, editable)</span>'}</label><div class="flex gap-1"><input id="fSku" placeholder="Auto-generates..." value="${App.escapeHtml(x.sku||'')}" class="flex-1 border rounded px-3 py-2"/>${e?'':'<button onclick="genSku()" title="Generate new SKU" class="px-3 bg-slate-100 hover:bg-slate-200 rounded" type="button">↻</button>'}</div></div>
    <div><label for="fBarcode" class="block font-medium mb-1">Barcode</label><input id="fBarcode" placeholder="Barcode" value="${App.escapeHtml(x.barcode||'')}" class="w-full border rounded px-3 py-2"/></div>
    <div class="col-span-2"><label for="fName" class="block font-medium mb-1">Product Name *</label><input id="fName" placeholder="Product name" value="${App.escapeHtml(x.name||'')}" class="w-full border rounded px-3 py-2"/></div>
    <div><label for="fCat" class="block font-medium mb-1">Category *</label><select id="fCat" class="w-full border rounded px-3 py-2"><option value="">Select category</option>${opts(cats,x.categoryId)}</select></div>
    <div><label for="fUnit" class="block font-medium mb-1">Unit *</label><select id="fUnit" class="w-full border rounded px-3 py-2"><option value="">Select unit</option>${opts(units,x.unitId)}</select></div>
    <div><label for="fBrand" class="block font-medium mb-1">Brand *</label><select id="fBrand" class="w-full border rounded px-3 py-2"><option value="">Select brand</option>${opts(brands,x.brandId)}</select></div>
    <div><label for="fStatus" class="block font-medium mb-1">Status</label><select id="fStatus" class="w-full border rounded px-3 py-2"><option${st==='ACTIVE'?' selected':''}>ACTIVE</option><option${st==='INACTIVE'?' selected':''}>INACTIVE</option></select></div>
    <div><label for="fPrice" class="block font-medium mb-1">Selling Price (Rs.) *</label><input id="fPrice" type="number" step="0.01" min="0" placeholder="0.00" value="${x.sellingPrice??''}" class="w-full border rounded px-3 py-2"/></div>
    <div><label for="fCost" class="block font-medium mb-1">Cost Price (Rs.)</label><input id="fCost" type="number" step="0.01" min="0" placeholder="0.00" value="${x.costPrice??''}" class="w-full border rounded px-3 py-2"/></div>
    <div><label for="fStock" class="block font-medium mb-1">Current Stock</label><input id="fStock" type="number" min="0" placeholder="0" value="${x.currentStock??0}" class="w-full border rounded px-3 py-2"/></div>
    <div><label for="fMin" class="block font-medium mb-1">Min Stock Level</label><input id="fMin" type="number" min="0" placeholder="10" value="${x.minStockLevel??10}" class="w-full border rounded px-3 py-2"/></div>
    <div class="col-span-2"><label for="fImg" class="block font-medium mb-1">Product Image ${e?'':'*'}</label>
      <div class="flex items-center gap-3">
        <img id="fImgPrev" src="${App.escapeHtml(App.imgUrl(x.imageUrl||''))}" class="${x.imageUrl?'w-16 h-16 object-contain bg-slate-100 rounded-lg border':'hidden w-16 h-16 object-contain bg-slate-100 rounded-lg border'}" onerror="this.classList.add('hidden')" alt="preview"/>
        <input id="fImg" type="file" accept="image/jpeg,image/png,image/webp,image/gif" onchange="prevImg(this)" class="w-full border rounded px-3 py-2"/>
      </div>
      <div class="text-xs text-slate-500 mt-1">JPG / PNG / WebP / GIF, max 5MB${e?' — leave empty to keep current image':''}</div></div></div>
    <div class="flex gap-2 mt-4"><button onclick="saveP(${e?x.id:'null'})" class="flex-1 bg-orange-500 text-white py-2 rounded-lg font-bold">Save</button>
    <button onclick="App.closeModal()" class="flex-1 bg-slate-100 py-2 rounded-lg">Cancel</button></div>`);
  if(!e)genSku();
  const _cat=document.getElementById('fCat');
  if(_cat&&!e)_cat.addEventListener('change',()=>{const s=document.getElementById('fSku');if(s&&!s.value)genSku();});
}
async function genSku(){
  const cat=document.getElementById('fCat');
  const q=cat&&cat.value?`?categoryId=${cat.value}`:'';
  try{const r=await App.get('/api/products/next-sku'+q);
    if(r.data)document.getElementById('fSku').value=r.data;
  }catch(e){}
}
function prevImg(inp){
  const prev=document.getElementById('fImgPrev');
  if(inp.files&&inp.files[0]&&prev){prev.src=URL.createObjectURL(inp.files[0]);prev.classList.remove('hidden');}
}
async function saveP(id){
  const v=i=>((document.getElementById(i)||{}).value||'');
  if(!v('fName').trim())return App.toast('Product name is required','warn');
  if(!v('fCat'))return App.toast('Category is required','warn');
  if(!v('fBrand'))return App.toast('Brand is required','warn');
  if(!v('fUnit'))return App.toast('Unit is required','warn');
  if(!v('fPrice'))return App.toast('Selling price is required','warn');
  const b={sku:v('fSku'),barcode:v('fBarcode')||null,name:v('fName'),categoryId:Number(v('fCat')),unitId:Number(v('fUnit')),brandId:Number(v('fBrand')),
    sellingPrice:Number(v('fPrice')),costPrice:v('fCost')?Number(v('fCost')):0,currentStock:Number(v('fStock')||0),minStockLevel:Number(v('fMin')||0),status:v('fStatus')};
  try{
    if(id){
      await App.put('/api/products/'+id,b);
      const f=(document.getElementById('fImg')||{}).files;
      if(f&&f[0]){await App.postImg('/api/products/'+id+'/images',f[0]);}
    }else{
      const f=(document.getElementById('fImg')||{}).files;
      if(!f||!f[0])return App.toast('Product image is required','warn');
      const fd=new FormData();
      fd.append('product',new Blob([JSON.stringify(b)],{type:'application/json'}));
      fd.append('image',f[0]);
      await App.postForm('/api/products',fd);
    }
    App.toast('Saved','success');App.closeModal();loadP(pg);}catch(e){}
}
async function delP(id){if(!confirm('Deactivate this product? It will be hidden from the shop but sales history is kept.'))return;try{await App.del('/api/products/'+id);App.toast('Product deactivated','success');loadP(pg);}catch(e){}}
document.addEventListener('DOMContentLoaded',()=>loadP(0));
</script>
</section>
</html>
