<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/admin-layout :: layout(~{::section}, 'Suppliers')}">
<section>
<div class="flex items-center gap-2"><h1 class="text-xl font-extrabold">Suppliers</h1>
<div class="ml-auto"><label for="kw" class="block text-xs font-medium mb-1">Search Suppliers</label><input id="kw" placeholder="Company / contact..." class="border rounded-lg px-3 py-2 text-sm"/></div>
<button onclick="loadS(0)" class="bg-slate-900 text-white px-4 py-2 rounded-lg text-sm">Search</button>
<button onclick="sModal()" class="bg-orange-500 text-white px-4 py-2 rounded-lg text-sm font-bold">+ Add</button></div>
<div class="bg-white rounded-xl shadow mt-3 overflow-x-auto"><table class="w-full text-sm">
<thead class="bg-slate-50"><tr><th class="p-3 text-left">Name</th><th class="p-3 text-left">Phone</th><th class="p-3 text-left">Email</th><th class="p-3 text-left">Status</th><th class="p-3 text-left">Actions</th></tr></thead>
<tbody id="rows"></tbody></table></div>
<div class="flex gap-2 mt-3 text-sm"><button onclick="pgGo(-1)" class="px-3 py-1.5 bg-white border rounded">← Prev</button><span id="pageInfo" class="text-slate-500"></span><button onclick="pgGo(1)" class="px-3 py-1.5 bg-white border rounded">Next →</button></div>
<script>
let pg=0;function pgGo(d){pg=Math.max(0,pg+d);loadS(pg);}
async function loadS(p=0){pg=p;try{const r=await App.get(`/api/suppliers?keyword=${encodeURIComponent(document.getElementById('kw').value||'')}&page=${pg}&size=10`);
  const{items,page}=App.unwrapPage(r.data);
  document.getElementById('rows').innerHTML=items.map(s=>{const on=(s.status||'ACTIVE')==='ACTIVE';return `<tr class="border-t ${on?'':'opacity-60 bg-slate-50'}"><td class="p-3 font-medium">${App.escapeHtml(s.companyName||'')}</td>
  <td class="p-3">${App.escapeHtml(s.phone||'')}</td><td class="p-3">${App.escapeHtml(s.email||'')}</td>
  <td class="p-3">${App.badge(s.status||'ACTIVE')}</td>
  <td class="p-3 flex gap-1 flex-wrap"><button onclick='sModal(${JSON.stringify(s)})' class="px-2 py-1 bg-slate-100 rounded">Edit</button>
  <button onclick="hist(${s.id})" class="px-2 py-1 bg-blue-100 text-blue-700 rounded">History</button>
  ${on?`<button onclick="deactS(${s.id})" class="px-2 py-1 bg-amber-100 text-amber-700 rounded">Deactivate</button>`:`<button onclick="restoreS(${s.id})" class="px-2 py-1 bg-green-100 text-green-700 rounded">Reactivate</button>`}
  <button onclick="delS(${s.id})" class="px-2 py-1 bg-red-100 text-red-700 rounded">Delete</button></td></tr>`;}).join('')||'<tr><td colspan="5" class="p-4 text-center text-slate-400">None</td></tr>';
  if(page)document.getElementById('pageInfo').textContent=`Page ${page.number+1} of ${page.totalPages}`;}catch(e){}}
function sModal(s){s=s||{};const e=!!s.id;
  App.openModal(`<h3 class="font-bold mb-3">${e?'Edit':'Add'} Supplier</h3><div class="grid gap-3 text-sm">
  <div><label for="sName" class="block font-medium mb-1">Company Name *</label><input id="sName" value="${App.escapeHtml(s.companyName||'')}" placeholder="Company name" class="w-full border rounded px-3 py-2"/></div>
  <div><label for="sContact" class="block font-medium mb-1">Contact Person</label><input id="sContact" value="${App.escapeHtml(s.contactPerson||'')}" placeholder="Contact person" class="w-full border rounded px-3 py-2"/></div>
  <div><label for="sPhone" class="block font-medium mb-1">Phone</label><input id="sPhone" value="${App.escapeHtml(s.phone||'')}" placeholder="Phone" class="w-full border rounded px-3 py-2"/></div>
  <div><label for="sEmail" class="block font-medium mb-1">Email</label><input id="sEmail" value="${App.escapeHtml(s.email||'')}" placeholder="Email" class="w-full border rounded px-3 py-2"/></div>
  <div><label for="sTax" class="block font-medium mb-1">Tax / VAT Number</label><input id="sTax" value="${App.escapeHtml(s.taxNumber||'')}" placeholder="Tax/VAT number" class="w-full border rounded px-3 py-2"/></div>
  <div><label for="sAddr" class="block font-medium mb-1">Address</label><input id="sAddr" value="${App.escapeHtml(s.address||'')}" placeholder="Address" class="w-full border rounded px-3 py-2"/></div></div>
  <div class="flex gap-2 mt-3"><button onclick="saveS(${e?s.id:'null'})" class="flex-1 bg-orange-500 text-white py-2 rounded-lg font-bold">Save</button>
  <button onclick="App.closeModal()" class="flex-1 bg-slate-100 py-2 rounded-lg">Cancel</button></div>`);}
async function saveS(id){const v=i=>(document.getElementById(i)||{}).value||'';
  const b={companyName:v('sName'),contactPerson:v('sContact'),phone:v('sPhone'),email:v('sEmail')||null,address:v('sAddr'),taxNumber:v('sTax')};
  try{id?await App.put('/api/suppliers/'+id,b):await App.post('/api/suppliers',b);App.toast('Saved','success');App.closeModal();loadS(pg);}catch(e){}}
async function hist(id){try{const r=await App.get('/api/suppliers/'+id+'/purchase-history');
  const d=r.data||{};const s=d.supplier||{};const orders=d.orders||[];
  const rows=orders.map(o=>{
    const items=(o.items||[]).map(it=>`${App.escapeHtml(it.product?it.product.name:('Item #'+it.id))} × ${it.orderedQty??0}`).join(', ');
    const dt=(o.orderDate||'').replace('T',' ').substring(0,16);
    return `<tr class="border-t"><td class="p-2 font-medium">${App.escapeHtml(o.poNumber||o.id)}</td>
    <td class="p-2 text-xs text-slate-500">${dt}</td>
    <td class="p-2 text-xs max-w-52 truncate" title="${App.escapeHtml(items)}">${App.escapeHtml(items||'—')}</td>
    <td class="p-2 text-right font-semibold whitespace-nowrap">${App.money(o.totalAmount)}</td>
    <td class="p-2">${App.badge(o.status)}</td></tr>`;}).join('');
  App.openModal(`<h3 class="font-bold text-lg">Purchase History</h3>
  <div class="text-sm text-slate-600 mb-3">${App.escapeHtml(s.companyName||'')} <span class="text-slate-400">• ${App.escapeHtml(s.phone||'')}</span></div>
  <div class="grid grid-cols-3 gap-2 text-center mb-3">
    <div class="bg-slate-50 rounded-lg p-2"><div class="text-[11px] text-slate-500">Total Orders</div><div class="font-extrabold text-lg">${d.count??0}</div></div>
    <div class="bg-slate-50 rounded-lg p-2"><div class="text-[11px] text-slate-500">Total Spent</div><div class="font-extrabold text-lg text-orange-600">${App.money(d.total)}</div></div>
    <div class="bg-slate-50 rounded-lg p-2"><div class="text-[11px] text-slate-500">Last Order</div><div class="font-bold text-sm mt-1">${App.escapeHtml((d.lastOrderDate||'').replace('T',' ').substring(0,10)||'—')}</div></div>
  </div>
  <div class="max-h-72 overflow-y-auto border rounded-lg"><table class="w-full text-sm">
  <thead class="bg-slate-50 sticky top-0"><tr><th class="p-2 text-left">PO #</th><th class="p-2 text-left">Date</th><th class="p-2 text-left">Items</th><th class="p-2 text-right">Total</th><th class="p-2 text-left">Status</th></tr></thead>
  <tbody>${rows||'<tr><td colspan="5" class="p-4 text-center text-slate-400">No purchase orders yet</td></tr>'}</tbody></table></div>
  <button onclick="App.closeModal()" class="mt-3 w-full bg-slate-100 py-2 rounded-lg">Close</button>`);}catch(e){}}
async function deactS(id){try{await App.patch('/api/suppliers/'+id+'/status',{status:'INACTIVE'});App.toast('Supplier deactivated — history kept','success');loadS(pg);}catch(e){}}
async function restoreS(id){try{await App.patch('/api/suppliers/'+id+'/status',{status:'ACTIVE'});App.toast('Supplier reactivated','success');loadS(pg);}catch(e){}}
async function delS(id){if(!confirm('PERMANENTLY delete this supplier? This only works if it has no purchase orders. Otherwise deactivate it instead.'))return;try{await App.del('/api/suppliers/'+id);App.toast('Supplier deleted','success');loadS(pg);}catch(e){}}
document.addEventListener('DOMContentLoaded',()=>loadS(0));
</script>
</section>
</html>
