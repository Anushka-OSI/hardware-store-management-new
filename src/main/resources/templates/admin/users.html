<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/admin-layout :: layout(~{::section}, 'Users')}">
<section>
<div class="flex items-center gap-2">
  <h1 class="text-xl font-extrabold">Users</h1>
  <div class="ml-auto flex items-end gap-2"><div><label for="kw" class="block text-xs font-medium mb-1">Search Users</label><input id="kw" placeholder="Username / name / email..." class="border rounded-lg px-3 py-2 text-sm"/></div>
  <button onclick="loadUsers(0)" class="bg-slate-900 text-white px-4 py-2 rounded-lg text-sm">Search</button></div>
  <button onclick="userModal()" class="bg-orange-500 text-white px-4 py-2 rounded-lg text-sm font-bold">+ Add</button>
</div>
<div class="bg-white rounded-xl shadow mt-3 overflow-x-auto">
<table class="w-full text-sm"><thead class="bg-slate-50"><tr><th class="p-3 text-left">Username</th><th class="p-3 text-left">Name</th><th class="p-3 text-left">Role</th><th class="p-3 text-left">Status</th><th class="p-3 text-left">Actions</th></tr></thead>
<tbody id="rows"></tbody></table></div>
<div class="flex gap-2 mt-3 text-sm"><button onclick="pgGo(-1)" class="px-3 py-1.5 bg-white border rounded">← Prev</button><span id="pageInfo" class="text-slate-500"></span><button onclick="pgGo(1)" class="px-3 py-1.5 bg-white border rounded">Next →</button></div>
<script>
let pg=0;function pgGo(d){pg=Math.max(0,pg+d);loadUsers(pg);}
async function loadUsers(p=0){pg=p;
  const kw=document.getElementById('kw').value||'';
  try{const r=await App.get(`/api/admin/users?keyword=${encodeURIComponent(kw)}&page=${pg}&size=10`);
    const{items,page}=App.unwrapPage(r.data);
    document.getElementById('rows').innerHTML=items.map(u=>`<tr class="border-t">
      <td class="p-3 font-medium">${App.escapeHtml(u.username)}</td><td class="p-3">${App.escapeHtml(u.fullName||'')}</td>
      <td class="p-3">${App.escapeHtml(u.roleName||u.role||'')}</td><td class="p-3">${App.badge(u.status)}</td>
      <td class="p-3 flex gap-1 flex-wrap"><button onclick='userModal(${JSON.stringify(u)})' class="px-2 py-1 bg-slate-100 rounded">Edit</button>
      ${u.status==='ACTIVE'
        ?`<button onclick="toggleUser(${u.id},'${u.status}')" class="px-2 py-1 bg-amber-100 text-amber-700 rounded">Deactivate</button>`
        :`<button onclick="toggleUser(${u.id},'${u.status}')" class="px-2 py-1 bg-green-100 text-green-700 rounded">Activate</button>`}
      <button onclick="delUser(${u.id})" class="px-2 py-1 bg-red-100 text-red-700 rounded">Delete</button></td></tr>`).join('')||'<tr><td colspan="5" class="p-4 text-center text-slate-400">No users</td></tr>';
    if(page)document.getElementById('pageInfo').textContent=`Page ${page.number+1} of ${page.totalPages} • ${page.totalElements}`;
  }catch(e){}
}
function userModal(u){
  const isEdit=!!(u&&u.id);u=u||{};const curRole=u.roleName||u.role||'CASHIER';
  const roles=['ADMIN','INVENTORY_MANAGER','CASHIER','SUPPLIER'].map(r=>`<option value="${r}"${r===curRole?' selected':''}>${r}</option>`).join('');
  App.openModal(`<h3 class="font-bold text-lg mb-3">${isEdit?'Edit':'Add'} User</h3>
    <div class="grid grid-cols-2 gap-3 text-sm">
    ${isEdit?'':`<div><label for="mUsername" class="block font-medium mb-1">Username *</label><input id="mUsername" placeholder="e.g. cashier02" class="w-full border rounded px-3 py-2"/></div><div><label for="mPassword" class="block font-medium mb-1">Password *</label><input id="mPassword" type="password" oninput="pwHint()" placeholder="Strong password" class="w-full border rounded px-3 py-2"/><div id="pwHint" class="text-xs text-slate-500 mt-1">Min 8 chars: A-Z, a-z, 0-9 + special (@#%&*)</div></div>`}
    <div><label for="mFull" class="block font-medium mb-1">Full Name</label><input id="mFull" placeholder="Full name" value="${App.escapeHtml(u.fullName||'')}" class="w-full border rounded px-3 py-2"/></div>
    <div><label for="mEmail" class="block font-medium mb-1">Email</label><input id="mEmail" placeholder="Email" value="${App.escapeHtml(u.email||'')}" class="w-full border rounded px-3 py-2"/></div>
    <div><label for="mPhone" class="block font-medium mb-1">Phone</label><input id="mPhone" placeholder="Phone" value="${App.escapeHtml(u.phone||'')}" class="w-full border rounded px-3 py-2"/></div>
    <div><label for="mRole" class="block font-medium mb-1">Role *</label><select id="mRole" class="w-full border rounded px-3 py-2">${roles}</select></div>
    ${isEdit?`<div class="col-span-2"><label for="mNewPass" class="block font-medium mb-1">New Password <span class="font-normal text-slate-500">(leave blank to keep current)</span></label><input id="mNewPass" type="password" oninput="pwHintEdit()" placeholder="Leave blank = no change" class="w-full border rounded px-3 py-2"/><div id="pwHintEdit" class="text-xs text-slate-500 mt-1">Min 8 chars: A-Z, a-z, 0-9 + special (@#%&*)</div></div>`:''}
    </div>
    <div class="flex gap-2 mt-4"><button onclick="saveUser(${isEdit?u.id:'null'},'${curRole}')" class="flex-1 bg-orange-500 text-white py-2 rounded-lg font-bold">Save</button>
    <button onclick="App.closeModal()" class="flex-1 bg-slate-100 py-2 rounded-lg">Cancel</button></div>`);
}
function pwCheck(pw,username){
  if(!pw||pw.length<8)return 'Password must be at least 8 characters long';
  if(!/[A-Z]/.test(pw))return 'Password must contain an uppercase letter (A-Z)';
  if(!/[a-z]/.test(pw))return 'Password must contain a lowercase letter (a-z)';
  if(!/[0-9]/.test(pw))return 'Password must contain a digit (0-9)';
  if(!/[^A-Za-z0-9]/.test(pw))return 'Password must contain a special character (@#%&*...)';
  const up=(username||'').split('@')[0]||'';
  if(up&&pw.toLowerCase().includes(up.toLowerCase()))return 'Password must not contain your username';
  return '';
}
function pwHint(){
  const el=document.getElementById('pwHint');if(!el)return;
  const msg=pwCheck((document.getElementById('mPassword')||{}).value||'',(document.getElementById('mUsername')||{}).value||'');
  const ok=!msg;
  el.textContent=ok?'✓ Strong password':('• '+msg);
  el.className='text-xs mt-1 '+(ok?'text-green-600 font-semibold':'text-slate-500');
}
function pwHintEdit(){
  const el=document.getElementById('pwHintEdit');if(!el)return;
  const v=(document.getElementById('mNewPass')||{}).value||'';
  if(!v){el.textContent='Leave blank = password stays unchanged';el.className='text-xs text-slate-500 mt-1';return;}
  const msg=pwCheck(v,'');
  el.textContent=msg?('• '+msg):'✓ Strong password';
  el.className='text-xs mt-1 '+(!msg?'text-green-600 font-semibold':'text-slate-500');
}
async function saveUser(id,origRole){
  try{
    if(id){
      const np=val('mNewPass');
      if(np){const err=pwCheck(np,'');if(err){App.toast(err,'error');return;}}
      await App.put('/api/admin/users/'+id,{fullName:val('mFull'),email:val('mEmail'),phone:val('mPhone'),password:np||null});
      const newRole=val('mRole');
      if(newRole&&newRole!==origRole){await App.patch('/api/admin/users/'+id+'/role',{roleName:newRole});}
    }
    else{
      const err=pwCheck(val('mPassword'),val('mUsername'));
      if(err){App.toast(err,'error');return;}
      await App.post('/api/admin/users',{username:val('mUsername'),password:val('mPassword'),fullName:val('mFull'),email:val('mEmail'),phone:val('mPhone'),roleName:val('mRole')});}
    App.toast('Saved','success');App.closeModal();loadUsers(pg);
  }catch(e){}
  function val(i){return(document.getElementById(i)||{}).value||'';}
}
async function toggleUser(id,st){try{await App.patch('/api/admin/users/'+id+'/status',{status:st==='ACTIVE'?'INACTIVE':'ACTIVE'});App.toast(st==='ACTIVE'?'User deactivated — login blocked, history kept':'User reactivated','success');loadUsers(pg);}catch(e){}}
async function delUser(id){if(!confirm('PERMANENTLY delete this user? This only works if they have no sales, audit or stock history. Otherwise deactivate instead. You cannot delete yourself or the last admin.'))return;try{await App.del('/api/admin/users/'+id);App.toast('User deleted','success');loadUsers(pg);}catch(e){}}
document.addEventListener('DOMContentLoaded',()=>loadUsers(0));
</script>
</section>
</html>
