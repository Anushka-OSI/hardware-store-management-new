<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/admin-layout :: layout(~{::section}, 'Categories')}">
<section>
<div class="flex items-center gap-2"><h1 class="text-xl font-extrabold">Categories</h1>
<button onclick="cModal()" class="ml-auto bg-orange-500 text-white px-4 py-2 rounded-lg text-sm font-bold">+ Add</button></div>
<div class="bg-white rounded-xl shadow mt-3 overflow-x-auto"><table class="w-full text-sm">
<thead class="bg-slate-50"><tr><th class="p-3 text-left">Name</th><th class="p-3 text-left">Description</th><th class="p-3 text-left">Active</th><th class="p-3 text-left">Actions</th></tr></thead>
<tbody id="rows"></tbody></table></div>
<script>
async function loadC(){try{const r=await App.get('/api/categories?page=0&size=100');
  const{items}=App.unwrapPage(r.data);
  document.getElementById('rows').innerHTML=items.map(c=>`<tr class="border-t"><td class="p-3 font-medium">${App.escapeHtml(c.name)}</td>
  <td class="p-3">${App.escapeHtml(c.description||'')}</td><td class="p-3">${c.active?App.badge('ACTIVE'):App.badge('INACTIVE')}</td>
  <td class="p-3 flex gap-1"><button onclick='cModal(${JSON.stringify(c)})' class="px-2 py-1 bg-slate-100 rounded">Edit</button>
  <button onclick="toggleC(${c.id},${c.active})" class="px-2 py-1 bg-amber-100 rounded">${c.active?'Disable':'Enable'}</button>
  <button onclick="delC(${c.id})" class="px-2 py-1 bg-red-100 text-red-700 rounded">Delete</button></td></tr>`).join('')||'<tr><td colspan="4" class="p-4 text-center text-slate-400">None</td></tr>';}catch(e){}}
function cModal(c){c=c||{};const e=!!c.id;
  App.openModal(`<h3 class="font-bold mb-3">${e?'Edit':'Add'} Category</h3>
  <input id="cName" value="${App.escapeHtml(c.name||'')}" placeholder="Name *" class="w-full border rounded px-3 py-2 text-sm"/>
  <textarea id="cDesc" placeholder="Description" class="w-full border rounded px-3 py-2 text-sm mt-2">${App.escapeHtml(c.description||'')}</textarea>
  <div class="flex gap-2 mt-3"><button onclick="saveC(${e?c.id:'null'})" class="flex-1 bg-orange-500 text-white py-2 rounded-lg font-bold">Save</button>
  <button onclick="App.closeModal()" class="flex-1 bg-slate-100 py-2 rounded-lg">Cancel</button></div>`);}
async function saveC(id){const b={name:document.getElementById('cName').value,description:document.getElementById('cDesc').value};
  try{id?await App.put('/api/categories/'+id,b):await App.post('/api/categories',b);App.toast('Saved','success');App.closeModal();loadC();}catch(e){}}
async function toggleC(id,a){try{await App.patch('/api/categories/'+id+'/status',{active:!a});loadC();}catch(e){}}
async function delC(id){if(!confirm('Delete?'))return;try{await App.del('/api/categories/'+id);loadC();}catch(e){}}
document.addEventListener('DOMContentLoaded',loadC);
</script>
</section>
</html>
