<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/admin-layout :: layout(~{::section}, 'Purchase Orders')}">
<section>
<div class="flex items-center gap-2 flex-wrap"><h1 class="text-xl font-extrabold">Purchase Orders</h1>
<select id="fSt" class="ml-auto border rounded-lg px-3 py-2 text-sm"><option value="">All statuses</option><option>DRAFT</option><option>SENT</option><option>CONFIRMED</option><option>RECEIVED</option><option>CANCELLED</option></select>
<button onclick="loadPO(0)" class="bg-slate-900 text-white px-4 py-2 rounded-lg text-sm">Filter</button>
<button onclick="poModal()" class="bg-orange-500 text-white px-4 py-2 rounded-lg text-sm font-bold">+ New PO</button></div>
<div class="bg-white rounded-xl shadow mt-3 overflow-x-auto"><table class="w-full text-sm">
<thead class="bg-slate-50"><tr><th class="p-3 text-left">PO #</th><th class="p-3 text-left">Supplier</th><th class="p-3 text-right">Total</th><th class="p-3 text-left">Status</th><th class="p-3 text-left">Actions</th></tr></thead>
<tbody id="rows"></tbody></table></div>
<div class="flex gap-2 mt-3 text-sm"><button onclick="pgGo(-1)" class="px-3 py-1.5 bg-white border rounded">← Prev</button><span id="pageInfo" class="text-slate-500"></span><button onclick="pgGo(1)" class="px-3 py-1.5 bg-white border rounded">Next →</button></div>
<script>
let pg=0;function pgGo(d){pg=Math.max(0,pg+d);loadPO(pg);}
async function loadPO(p=0){pg=p;const st=document.getElementById('fSt').value;
  try{const r=await App.get(`/api/purchase-orders?status=${st}&page=${pg}&size=10`);
  const{items,page}=App.unwrapPage(r.data);
  document.getElementById('rows').innerHTML=items.map(o=>`<tr class="border-t">
    <td class="p-3 font-medium">${App.escapeHtml(o.poNumber||o.id)}</td><td class="p-3">${App.escapeHtml(o.supplierName||o.supplierId||'')}</td>
    <td class="p-3 text-right font-bold">${App.money(o.totalAmount)}</td><td class="p-3">${App.badge(o.status)}</td>
    <td class="p-3 flex gap-1 flex-wrap">
      <button onclick="detail(${o.id})" class="px-2 py-1 bg-slate-100 rounded">View</button>
      ${o.status==='DRAFT'?`<button onclick="act(${o.id},'send')" class="px-2 py-1 bg-blue-100 text-blue-700 rounded">Send</button>`:''}
      ${o.status==='SENT'?`<button onclick="act(${o.id},'confirm')" class="px-2 py-1 bg-green-100 text-green-700 rounded">Confirm</button>`:''}
      ${['DRAFT','SENT','CONFIRMED'].includes(o.status)?`<button onclick="act(${o.id},'cancel')" class="px-2 py-1 bg-red-100 text-red-700 rounded">Cancel</button>`:''}
    </td></tr>`).join('')||'<tr><td colspan="5" class="p-4 text-center text-slate-400">No orders</td></tr>';
  if(page)document.getElementById('pageInfo').textContent=`Page ${page.number+1} of ${page.totalPages}`;}catch(e){}}
function poModal(){App.openModal(`<h3 class="font-bold mb-3">New Purchase Order</h3><div class="grid gap-2 text-sm">
  <input id="poSup" type="number" placeholder="Supplier ID *" class="border rounded px-3 py-2"/>
  <input id="poProd" type="number" placeholder="Product ID *" class="border rounded px-3 py-2"/>
  <div class="grid grid-cols-2 gap-2"><input id="poQty" type="number" value="10" placeholder="Qty" class="border rounded px-3 py-2"/><input id="poPrice" type="number" step="0.01" placeholder="Unit cost" class="border rounded px-3 py-2"/></div>
  <input id="poNotes" placeholder="Notes" class="border rounded px-3 py-2"/></div>
  <div class="flex gap-2 mt-3"><button onclick="savePO()" class="flex-1 bg-orange-500 text-white py-2 rounded-lg font-bold">Create</button>
  <button onclick="App.closeModal()" class="flex-1 bg-slate-100 py-2 rounded-lg">Cancel</button></div>`);}
async function savePO(){const v=i=>(document.getElementById(i)||{}).value||'';
  const b={supplierId:Number(v('poSup')),notes:v('poNotes'),items:[{productId:Number(v('poProd')),quantity:Number(v('poQty')),unitCost:Number(v('poPrice')||0)}]};
  try{await App.post('/api/purchase-orders',b);App.toast('PO created','success');App.closeModal();loadPO(pg);}catch(e){}}
async function detail(id){try{const r=await App.get('/api/purchase-orders/'+id);
  App.openModal(`<h3 class="font-bold mb-2">PO ${App.escapeHtml(r.data.poNumber||id)}</h3><pre class="text-xs bg-slate-50 p-3 rounded overflow-auto max-h-80">${App.escapeHtml(JSON.stringify(r.data,null,2))}</pre><button onclick="App.closeModal()" class="mt-3 w-full bg-slate-100 py-2 rounded-lg">Close</button>`);}catch(e){}}
async function act(id,a){try{await App.patch(`/api/purchase-orders/${id}/${a}`,{});App.toast('Done','success');loadPO(pg);}catch(e){}}
document.addEventListener('DOMContentLoaded',()=>loadPO(0));
</script>
</section>
</html>
