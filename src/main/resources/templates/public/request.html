<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/public-layout :: layout(~{::section}, 'Request Item — GURUGE HARDWARE')}">
<section>
<h1 class="text-2xl font-extrabold">Request an Item</h1>
<p class="text-sm text-slate-500">Can't find what you need? Send us a request — we reply with availability &amp; price.</p>
<div class="bg-white rounded-xl shadow p-5 mt-4 max-w-2xl">
  <div class="grid md:grid-cols-2 gap-3">
    <div><label class="text-sm font-medium">Your name *</label><input id="rName" class="mt-1 w-full border rounded-lg px-3 py-2" placeholder="Nimal Perera"/></div>
    <div><label class="text-sm font-medium">Phone *</label><input id="rPhone" class="mt-1 w-full border rounded-lg px-3 py-2" placeholder="077 000 0000"/></div>
  </div>
  <div class="mt-3"><label class="text-sm font-medium">Email</label><input id="rEmail" type="email" class="mt-1 w-full border rounded-lg px-3 py-2" placeholder="you@email.com"/></div>
  <div class="mt-3"><label class="text-sm font-medium">What do you need? *</label><textarea id="rMsg" rows="4" class="mt-1 w-full border rounded-lg px-3 py-2" placeholder="e.g. Bosch GSB 13 RE drill + cart items..."></textarea></div>
  <button onclick="submitReq()" class="mt-4 bg-orange-500 text-white px-6 py-2.5 rounded-lg font-bold hover:bg-orange-600">Submit Request</button>
  <div id="reqOk" class="hidden mt-4 bg-green-50 border border-green-200 rounded-lg p-4 text-sm"></div>
</div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
  const items=Cart.all();
  if(items.length){document.getElementById('rMsg').value='Cart items:\n'+items.map(i=>`- ${i.name} × ${i.qty} (${App.money(i.price)})`).join('\n')+'\nTotal: '+App.money(Cart.total())+'\n\nNote: ';}
});
async function submitReq(){
  const payload={customerName:document.getElementById('rName').value.trim(),phone:document.getElementById('rPhone').value.trim(),email:document.getElementById('rEmail').value.trim()||null,message:document.getElementById('rMsg').value.trim()};
  if(!payload.customerName||!payload.phone||!payload.message)return App.toast('Name, phone and message are required','warn');
  try{
    const r=await App.post('/api/public/requests',payload);
    const d=r.data||{};
    document.getElementById('reqOk').classList.remove('hidden');
    document.getElementById('reqOk').innerHTML=`✅ Request received! Your <b>Request ID: ${App.escapeHtml(d.requestId||d.id||'')}</b>. Save it and <a class="text-orange-600 underline" href="/request/status">track status here</a>.`;
    App.toast('Request submitted','success');Cart.clear();
  }catch(e){}
}
</script>
</section>
</html>
