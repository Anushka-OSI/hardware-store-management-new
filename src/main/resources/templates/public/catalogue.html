<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/public-layout :: layout(~{::section}, 'Catalogue — GURUGE HARDWARE')}">
<section>
<h1 class="text-2xl font-extrabold">Product Catalogue</h1>
<div class="bg-white rounded-xl shadow p-4 mt-3 grid md:grid-cols-6 gap-3">
  <div class="md:col-span-2"><label for="searchInp" class="block text-xs font-medium mb-1">Search</label><input id="searchInp" placeholder="Name / SKU / brand..." class="w-full border rounded-lg px-3 py-2"/></div>
  <div><label for="catSel" class="block text-xs font-medium mb-1">Category</label><select id="catSel" class="w-full border rounded-lg px-3 py-2"><option value="">All Categories</option></select></div>
  <div><label for="brandSel" class="block text-xs font-medium mb-1">Brand</label><select id="brandSel" class="w-full border rounded-lg px-3 py-2"><option value="">All Brands</option></select></div>
  <div><label for="sortSel" class="block text-xs font-medium mb-1">Sort By</label><select id="sortSel" class="w-full border rounded-lg px-3 py-2"><option value="">Sort: Default</option><option value="priceAsc">Price ↑</option><option value="priceDesc">Price ↓</option><option value="nameAsc">Name A–Z</option></select></div>
  <div><label for="availSel" class="block text-xs font-medium mb-1">Availability</label><select id="availSel" class="w-full border rounded-lg px-3 py-2"><option value="">All stock</option><option value="IN_STOCK">In stock</option><option value="OUT">Out of stock</option></select></div>
  <div><label for="minP" class="block text-xs font-medium mb-1">Min Price (Rs.)</label><input id="minP" type="number" min="0" placeholder="Min Rs." class="w-full border rounded-lg px-3 py-2"/></div>
  <div><label for="maxP" class="block text-xs font-medium mb-1">Max Price (Rs.)</label><input id="maxP" type="number" min="0" placeholder="Max Rs." class="w-full border rounded-lg px-3 py-2"/></div>
  <select id="pageSize" class="border rounded-lg px-3 py-2 hidden"><option>12</option></select>
  <button onclick="Catalogue.load(0)" class="bg-orange-500 text-white rounded-lg px-4 py-2 font-bold md:col-span-2">Apply Filters</button>
  <a href="/catalogue" class="bg-slate-100 rounded-lg px-4 py-2 text-center">Reset</a>
</div>
<div id="grid" class="grid grid-cols-2 md:grid-cols-4 gap-4 mt-4"></div>
<div class="flex items-center gap-2 mt-4 text-sm">
  <button onclick="__pageGo(-1)" class="px-3 py-1.5 bg-white border rounded">← Prev</button>
  <span id="pageInfo" class="text-slate-500">Page 1</span>
  <button onclick="__pageGo(1)" class="px-3 py-1.5 bg-white border rounded">Next →</button>
</div>
<script src="/js/catalogue.js"></script>
<script>
let __pg=0;function __pageGo(d){__pg=Math.max(0,__pg+d);Catalogue.load(__pg);}
document.addEventListener('DOMContentLoaded',async()=>{
  const q=new URLSearchParams(location.search);
  if(q.get('keyword'))document.getElementById('searchInp').value=q.get('keyword');
  await Catalogue.loadCats();await Catalogue.loadBrands();await Catalogue.load(0);
  document.getElementById('searchInp').addEventListener('keydown',e=>{if(e.key==='Enter')Catalogue.load(0);});
});
</script>
</section>
</html>
