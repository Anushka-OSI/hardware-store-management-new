<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/admin-layout :: layout(~{::section}, 'Inventory Reports')}">
<section><h1 class="text-xl font-extrabold">Inventory Reports</h1>
<div class="grid md:grid-cols-2 gap-4 mt-3">
<div class="bg-white rounded-xl shadow p-4"><h3 class="font-bold">Stock Valuation</h3><div id="val" class="text-2xl font-extrabold text-orange-600 mt-2">—</div></div>
<div class="bg-white rounded-xl shadow p-4"><h3 class="font-bold">Inventory Summary</h3><div id="rep" class="text-sm mt-2">—</div></div>
</div>
<script>
document.addEventListener('DOMContentLoaded',async()=>{
try{const r=await App.get('/api/inventory/valuation');document.getElementById('val').textContent=App.money(r.data);}catch(e){}
try{const r=await App.get('/api/reports/inventory');const d=r.data||{};
document.getElementById('rep').innerHTML=`Products: <b>${d.totalProducts??0}</b><br/>Valuation: <b>${App.money(d.valuation)}</b><br/>Out of stock: <b>${d.outOfStockCount??0}</b>`;}catch(e){}
});
</script></section></html>
