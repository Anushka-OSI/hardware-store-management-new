<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Login — GURUGE HARDWARE</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-slate-900 min-h-screen grid place-items-center p-4">
<div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-8">
  <div class="text-center mb-6"><div class="inline-grid place-items-center w-14 h-14 rounded-2xl bg-orange-500 text-2xl font-black">G</div>
  <h1 class="text-2xl font-extrabold mt-2">GURUGE HARDWARE</h1><p class="text-sm text-slate-500">Staff login</p></div>
  <div th:if="${param.error}" class="bg-red-50 text-red-700 text-sm p-3 rounded-lg mb-3">Invalid username or password.</div>
  <div th:if="${param.logout}" class="bg-green-50 text-green-700 text-sm p-3 rounded-lg mb-3">Logged out successfully.</div>
  <form th:action="@{/login}" method="post" class="space-y-3">
    <input type="hidden" th:name="${_csrf?.parameterName}" th:value="${_csrf?.token}"/>
    <div><label class="text-sm font-medium">Username</label><input name="username" required class="mt-1 w-full border rounded-lg px-3 py-2" placeholder="admin"/></div>
    <div><label class="text-sm font-medium">Password</label><input name="password" type="password" required class="mt-1 w-full border rounded-lg px-3 py-2" placeholder="••••••"/></div>
    <button class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-2.5 rounded-lg">Login</button>
  </form>
  <div class="mt-5 text-xs bg-slate-50 border rounded-lg p-3 text-slate-600">
    <div class="font-bold mb-1">Demo accounts</div>
    <div>admin@gurugehardware.lk / Admin@123</div>
    <div>inventory@gurugehardware.lk / Inventory@123</div>
    <div>cashier@gurugehardware.lk / Cashier@123</div>
    <div>supplier@example.com / Supplier@123</div>
  </div>
  <a href="/" class="block text-center text-sm text-slate-500 mt-4 hover:text-orange-600">← Back to store</a>
</div>
</body>
</html>
