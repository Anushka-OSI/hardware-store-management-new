<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/admin-layout :: layout(~{::section}, 'Supplier Reports')}">
<section><h1 class="text-xl font-extrabold">Supplier Reports</h1>
<div class="bg-white rounded-xl shadow p-4 mt-3"><div id="box" class="text-sm">Loading...</div></div>
<script>
document.addEventListener('DOMContentLoaded',async()=>{try{const r=await App.get('/api/reports/dashboard/supplier');const d=r.data||{};
document.getElementById('box').innerHTML=`Total POs: <b>${d.total??0}</b> • Pending: <b>${d.pending??0}</b> • Delivered: <b>${d.delivered??0}</b><br/><span class="text-slate-500">By status: ${App.escapeHtml(JSON.stringify(d.byStatus||{}))}</span>`;}catch(e){}});
</script></section></html>
