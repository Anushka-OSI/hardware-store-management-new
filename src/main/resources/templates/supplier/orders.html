<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/admin-layout :: layout(~{::section}, 'Supplier Orders')}">
<section><h1 class="text-xl font-extrabold">My Orders (GET /api/purchase-orders)</h1>
<div class="bg-white rounded-xl shadow mt-3 overflow-x-auto"><table class="w-full text-sm"><thead class="bg-slate-50"><tr><th class="p-3 text-left">PO #</th><th class="p-3 text-right">Total</th><th class="p-3 text-left">Status</th></tr></thead><tbody id="rows"></tbody></table></div>
<script>
document.addEventListener('DOMContentLoaded',async()=>{try{const r=await App.get('/api/purchase-orders?page=0&size=20');const{items}=App.unwrapPage(r.data);
document.getElementById('rows').innerHTML=items.map(o=>`<tr class="border-t"><td class="p-3">${App.escapeHtml(o.poNumber||o.id)}</td><td class="p-3 text-right font-bold">${App.money(o.totalAmount)}</td><td class="p-3">${App.badge(o.status)}</td></tr>`).join('');}catch(e){}});
</script></section></html>
