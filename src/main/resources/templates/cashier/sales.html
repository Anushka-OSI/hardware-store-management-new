<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/admin-layout :: layout(~{::section}, 'My Sales')}">
<section><h1 class="text-xl font-extrabold">My Sales</h1>
<div class="bg-white rounded-xl shadow mt-3 overflow-x-auto"><table class="w-full text-sm"><thead class="bg-slate-50"><tr><th class="p-3 text-left">Receipt</th><th class="p-3 text-right">Total</th><th class="p-3 text-left">Date</th></tr></thead><tbody id="rows"></tbody></table></div>
<script>
document.addEventListener('DOMContentLoaded',async()=>{try{const r=await App.get('/api/sales?page=0&size=20');const{items}=App.unwrapPage(r.data);
document.getElementById('rows').innerHTML=items.map(s=>`<tr class="border-t"><td class="p-3">${App.escapeHtml(s.receiptNumber||s.id)}</td><td class="p-3 text-right font-bold">${App.money(s.totalAmount)}</td><td class="p-3 text-xs">${App.escapeHtml(s.createdAt||'')}</td></tr>`).join('');}catch(e){}});
</script></section></html>
