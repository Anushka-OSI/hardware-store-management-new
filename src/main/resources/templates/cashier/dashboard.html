<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/admin-layout :: layout(~{::section}, 'Cashier Dashboard')}">
<section>
<h1 class="text-xl font-extrabold">Cashier Dashboard</h1>
<div class="grid grid-cols-2 gap-3 mt-3">
  <div class="bg-white rounded-xl shadow p-4"><div class="text-xs text-slate-500">Today Sales Count</div><div id="cCount" class="text-2xl font-extrabold">—</div></div>
  <div class="bg-white rounded-xl shadow p-4"><div class="text-xs text-slate-500">Today Revenue</div><div id="cRev" class="text-2xl font-extrabold text-green-700">—</div></div>
</div>
<a href="/cashier/pos" class="block text-center mt-4 bg-orange-500 hover:bg-orange-600 text-white text-lg font-extrabold py-4 rounded-xl">⚡ Open POS</a>
<div class="bg-white rounded-xl shadow mt-4 p-4"><h3 class="font-bold">Today's Sales</h3><table class="w-full text-sm mt-2"><thead class="bg-slate-50"><tr><th class="p-2 text-left">Receipt</th><th class="p-2 text-right">Total</th><th class="p-2 text-left">Pay</th></tr></thead><tbody id="rows"></tbody></table></div>
<script>
document.addEventListener('DOMContentLoaded',async()=>{
try{const r=await App.get('/api/reports/dashboard/cashier');const d=r.data||{};
document.getElementById('cCount').textContent=d.todayCount??0;
document.getElementById('cRev').textContent=App.money(d.todayRevenue);
document.getElementById('rows').innerHTML=(d.sales||[]).map(s=>`<tr class="border-t"><td class="p-2">${App.escapeHtml(s.receiptNumber||s.id)}</td><td class="p-2 text-right font-bold">${App.money(s.totalAmount)}</td><td class="p-2">${App.badge(s.paymentMethod||'CASH')}</td></tr>`).join('')||'<tr><td colspan="3" class="p-3 text-center text-slate-400">No sales today</td></tr>';}catch(e){}});
</script>
</section></html>
