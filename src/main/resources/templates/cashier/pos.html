<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/admin-layout :: layout(~{::section}, 'POS — Point of Sale')}">
<section>
<div class="flex items-center gap-2"><h1 class="text-xl font-extrabold">⚡ POS</h1><a href="/cashier/dashboard" class="ml-auto text-sm bg-slate-100 px-3 py-1.5 rounded">← Dashboard</a></div>
<div class="grid md:grid-cols-5 gap-4 mt-3">
  <!-- Left: product search grid -->
  <div class="md:col-span-3 bg-white rounded-xl shadow p-4">
    <div><label for="posSearch" class="block text-xs font-medium mb-1">Search Products</label><input id="posSearch" placeholder="Search product / SKU / barcode..." class="w-full border rounded-lg px-3 py-2 text-sm"/></div>
    <div id="posGrid" class="grid grid-cols-2 lg:grid-cols-3 gap-2 mt-3 max-h-[60vh] overflow-y-auto"></div>
  </div>
  <!-- Right: bill -->
  <div class="md:col-span-2 bg-white rounded-xl shadow p-4 h-fit">
    <h3 class="font-bold">🧾 Bill</h3>
    <div id="billItems" class="mt-2 max-h-64 overflow-y-auto"></div>
    <div class="grid grid-cols-2 gap-2 mt-3 text-sm">
      <div><label for="discType" class="block text-xs font-medium mb-1">Discount Type</label><select id="discType" onchange="POS.render()" class="w-full border rounded-lg px-2 py-2"><option value="NONE">No discount</option><option value="FIXED">Discount Rs.</option><option value="PERCENT">Discount %</option></select></div>
      <div><label for="discVal" class="block text-xs font-medium mb-1">Discount Value</label><input id="discVal" type="number" min="0" value="0" oninput="POS.render()" class="w-full border rounded-lg px-2 py-2" placeholder="0"/></div>
    </div>
    <div class="flex gap-2 mt-2">
      <button data-pay="CASH" onclick="POS.setPay('CASH')" class="flex-1 px-3 py-2 rounded-lg text-sm font-semibold bg-orange-500 text-white">CASH</button>
      <button data-pay="CARD" onclick="POS.setPay('CARD')" class="flex-1 px-3 py-2 rounded-lg text-sm font-semibold bg-slate-100">CARD</button>
      <button data-pay="DIGITAL" onclick="POS.setPay('DIGITAL')" class="flex-1 px-3 py-2 rounded-lg text-sm font-semibold bg-slate-100">DIGITAL</button>
    </div>
    <div class="mt-2"><label for="amtPaid" class="block text-xs font-medium mb-1">Amount Paid (Rs.) *</label><input id="amtPaid" type="number" min="0" placeholder="Amount paid Rs." oninput="POS.render()" class="w-full border rounded-lg px-3 py-2 text-sm"/></div>
    <div class="mt-2"><label for="posNotes" class="block text-xs font-medium mb-1">Notes</label><input id="posNotes" placeholder="Notes (optional)" class="w-full border rounded-lg px-3 py-2 text-sm"/></div>
    <div id="billSummary" class="mt-3 bg-slate-50 rounded-lg p-3 space-y-1"></div>
    <button onclick="POS.complete()" class="w-full mt-3 bg-green-600 hover:bg-green-700 text-white font-extrabold py-3 rounded-xl">Complete Sale → POST /api/sales</button>
  </div>
</div>
<script src="/js/pos.js"></script>
<script>
document.addEventListener('DOMContentLoaded',()=>{
  POS.search('');POS.render();
  let t;document.getElementById('posSearch').addEventListener('input',e=>{clearTimeout(t);t=setTimeout(()=>POS.search(e.target.value),300);});
});
</script>
</section>
</html>
