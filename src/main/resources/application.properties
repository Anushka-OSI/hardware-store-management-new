spring.application.name=hardwarestoremanagement

# --- App custom properties (com.guruge.hardware.config.AppProperties) ---
app.jwt.secret=change-me-please-use-a-very-long-secret-key-256bits-minimum-0123456789
app.jwt.expiration=86400000
app.jwt.refresh-expiration=604800000
app.storage.location=./uploads
app.storage.product-images=./uploads/product-images
app.storage.max-file-size=5242880
app.storage.allowed-types=image/jpeg,image/png,image/gif,image/webp
app.pagination.default-page-size=20
app.pagination.max-page-size=100
app.numbering.receipt-prefix=INV
app.numbering.po-prefix=PO
app.numbering.gr-prefix=GRN
app.numbering.return-prefix=RET
app.numbering.request-prefix=GRG-REQ
app.business.max-discount-percent=30.0
app.business.low-stock-threshold=10
app.business.currency=LKR
app.business.store-name=Guruge Hardware
